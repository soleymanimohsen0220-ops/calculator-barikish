name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev ccache build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install Cython==0.29.36

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Configure Buildozer to use system Android SDK
        run: |
          sed -i 's|#android.sdk_path =.*|android.sdk_path = /usr/lib/android-sdk|' buildozer.spec
          sed -i 's|# android.ndk_path =.*|android.ndk_path = /usr/local/lib/android/ndk|' buildozer.spec || true
          mkdir -p ~/.buildozer/android/platform
          ln -sf /usr/lib/android-sdk ~/.buildozer/android/platform/android-sdk
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV

      - name: Cache Buildozer global
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer/android/platform/python-for-android
            ~/.buildozer/android/platform/build
          key: ${{ runner.os }}-p4a-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-p4a-

      - name: Build debug APK
        run: buildozer -v android debug < /dev/null
        timeout-minutes: 60
        env:
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          ANDROID_HOME: /usr/lib/android-sdk

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorBarikish-APK
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dist/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            .buildozer/android/platform/python-for-android/*.log
            /tmp/*.log
          if-no-files-found: warn
          retention-days: 7
