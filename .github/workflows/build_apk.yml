name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev ccache build-essential

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install Cython==0.29.36

      - name: Cache Buildozer global
        uses: actions/cache@v3
        id: cache
        with:
          path: |
            ~/.buildozer/android/platform
          key: ${{ runner.os }}-buildozer-py311-${{ hashFiles('buildozer.spec') }}-v4
          restore-keys: |
            ${{ runner.os }}-buildozer-py311-

      - name: Build debug APK
        run: buildozer -v android debug < /dev/null
        timeout-minutes: 60

      - name: List APK
        if: always()
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          ls -la bin/ 2>/dev/null || echo "no bin dir"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorBarikish-APK
          path: |
            bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            .buildozer/android/platform/python-for-android/*.log
          if-no-files-found: warn
          retention-days: 7
