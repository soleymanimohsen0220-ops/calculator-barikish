name: Build Android APK (Docker)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Docker
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          chmod -R 777 .
          mkdir -p bin

      - name: Build APK in Buildozer container
        run: |
          # Fix pip in the image's venv first (Python 3.14 + old pip = import error)
          # Then run buildozer
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            -w /home/user/hostcwd \
            -e ANDROID_HOME=/home/user/.buildozer/android/platform/android-sdk \
            -e ANDROID_SDK_ROOT=/home/user/.buildozer/android/platform/android-sdk \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            ghcr.io/kivy/buildozer:latest \
            -c '
              set -e
              echo "=== Fixing pip in venv ==="
              /home/user/.venv/bin/python -m ensurepip --upgrade || true
              /home/user/.venv/bin/python -m pip install --upgrade pip setuptools wheel
              echo "=== Building APK ==="
              echo y | buildozer -v android debug
            '
        timeout-minutes: 60

      - name: List artifacts
        if: always()
        run: |
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "no APK found"
          echo "=== bin/ contents ==="
          ls -la bin/ 2>/dev/null || echo "no bin dir"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorBarikish-APK
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            .buildozer/android/platform/python-for-android/*.log
          if-no-files-found: warn
          retention-days: 7
