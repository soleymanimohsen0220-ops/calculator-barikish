name: Build Android APK (Docker)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK with Buildozer Docker Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_cmd: buildozer android debug
          os: ubuntu-22.04

      - name: List artifacts
        if: always()
        run: |
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "no APK found"
          echo "=== bin/ contents ==="
          ls -la bin/ 2>/dev/null || echo "no bin dir"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorBarikish-APK
          path: |
            bin/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            .buildozer/android/platform/python-for-android/*.log
            /github/home/.buildozer/android/platform/python-for-android/*.log
          if-no-files-found: warn
          retention-days: 7
